<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZX4RR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
height:100%;
overflow:hidden;
background:#020202;
}
.scene{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
perspective:1400px;
transform-style:preserve-3d;
background:
radial-gradient(circle at center,#0b0b0b 0%,#000 70%);
}

.layer{
position:absolute;
inset:-10%;
will-change:transform;
}

.bg{
background:
radial-gradient(circle at 50% 50%,rgba(0,255,120,.15),transparent 40%),
radial-gradient(circle at 20% 20%,rgba(0,120,255,.08),transparent 30%);
filter:blur(40px);
}

.glow{
background:
radial-gradient(circle at center,rgba(0,255,100,.25),transparent 35%);
filter:blur(80px);
}

.bike-wrap{
display:flex;
justify-content:center;
align-items:center;
}

.bike{
width:min(900px,90vw);
max-height:92vh;
object-fit:contain;
filter:drop-shadow(0 50px 80px rgba(0,0,0,.8));
}

.particles{
background-image:
radial-gradient(circle,rgba(0,255,120,.8) 1px,transparent 2px);
background-size:120px 120px;
opacity:.35;
}
</style>
</head>
<body>

<div class="scene" id="scene">
    <div class="layer bg" data-depth="8"></div>
    <div class="layer particles" data-depth="25"></div>
    <div class="layer glow" data-depth="15"></div>

    <div class="layer bike-wrap" data-depth="45">
        <img src="bike.png" class="bike" alt="Bike">
    </div>
</div>

<script>
const scene = document.getElementById("scene");
const layers = document.querySelectorAll("[data-depth]");

function update(x,y){
    layers.forEach(layer=>{
        const depth = parseFloat(layer.dataset.depth);
        const moveX = x * depth;
        const moveY = y * depth;

        layer.style.transform =
            `translate3d(${moveX}px,${moveY}px,0)
             rotateY(${x*8}deg)
             rotateX(${-y*8}deg)`;
    });
}

document.addEventListener("mousemove",(e)=>{
    const x=(e.clientX/window.innerWidth-.5);
    const y=(e.clientY/window.innerHeight-.5);
    update(x,y);
});

document.addEventListener("touchmove",(e)=>{
    const t=e.touches[0];
    const x=(t.clientX/window.innerWidth-.5);
    const y=(t.clientY/window.innerHeight-.5);
    update(x,y);
},{passive:true});

if(window.DeviceOrientationEvent){
    window.addEventListener("deviceorientation",(e)=>{
        const x=Math.max(-1,Math.min(1,(e.gamma||0)/25));
        const y=Math.max(-1,Math.min(1,(e.beta||0)/25));
        update(x,y);
    });
}
</script>

</body>
</html>
