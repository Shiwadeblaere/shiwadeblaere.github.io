<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiwa Deblaere</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    perspective:2200px;
}

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    transform-style:preserve-3d;
}

.layer{
    position:absolute;
    inset:-8%;
    background:url('scene.png') center center / cover no-repeat;
    will-change:transform;
}

/* Background */
.back{
    filter:brightness(.8);
    transform:scale(1.1);
}

/* Main layer */
.mid{
}

/* Foreground */
.foreground{
    filter:none;
}

/* Fog */
.fog{
    position:absolute;
    inset:-20%;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 30% 40%,
            rgba(255,255,255,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 70% 55%,
            rgba(255,255,255,.12),
            transparent 35%
        );
}

/* Vignette */
.vignette{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,.55) 100%
        );

    pointer-events:none;
}

/* Motion permission button */
.permission{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    padding:12px 20px;

    border-radius:999px;
    border:1px solid rgba(255,255,255,.15);

    background:rgba(0,0,0,.5);
    color:white;

    cursor:pointer;
}
</style>
</head>
<body>

<div class="scene">

    <div class="layer back" data-depth="12"></div>

    <div class="layer mid" data-depth="35"></div>

    <div class="layer foreground" data-depth="60"></div>

    <div class="fog" id="fog"></div>

    <div class="vignette"></div>

    <button id="gyroBtn" class="permission">
        Enable Motion
    </button>

</div>

<script>
const layers = document.querySelectorAll('[data-depth]');

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;

/* Smooth movement */
function animate(){

    currentX += (targetX - currentX) * 0.06;
    currentY += (targetY - currentY) * 0.06;

    layers.forEach(layer => {

        const depth = parseFloat(layer.dataset.depth);

        layer.style.transform =
        `
        translate3d(
            ${currentX * depth}px,
            ${currentY * depth}px,
            0
        )
        rotateY(${currentX * 8}deg)
        rotateX(${-currentY * 8}deg)
        scale(${1 + depth / 600})
        `;

    });

    requestAnimationFrame(animate);
}

animate();

/* Update target position */
function setPosition(x,y){

    targetX = x;
    targetY = y;
}

/* Mouse */
document.addEventListener('mousemove', e => {

    setPosition(
        (e.clientX / innerWidth) - 0.5,
        (e.clientY / innerHeight) - 0.5
    );

});

/* Touch */
document.addEventListener('touchmove', e => {

    const t = e.touches[0];

    setPosition(
        (t.clientX / innerWidth) - 0.5,
        (t.clientY / innerHeight) - 0.5
    );

},{
    passive:true
});

/* iPhone motion permission */
document.getElementById('gyroBtn').onclick = async () => {

    if(
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
    ){

        try{

            const result =
                await DeviceOrientationEvent.requestPermission();

            if(result === 'granted'){
                window.addEventListener(
                    'deviceorientation',
                    handleGyro
                );
            }

        }catch(err){}

    }else{

        window.addEventListener(
            'deviceorientation',
            handleGyro
        );
    }

    document.getElementById('gyroBtn').remove();
};

/* Gyroscope */
function handleGyro(e){

    setPosition(

        Math.max(
            -1,
            Math.min(
                1,
                (e.gamma || 0) / 25
            )
        ),

        Math.max(
            -1,
            Math.min(
                1,
                (e.beta || 0) / 25
            )
        )

    );
}

/* Floating fog */
let fogTime = 0;

setInterval(() => {

    fogTime += 0.01;

    document.getElementById('fog').style.transform =
    `
    translate(
        ${Math.sin(fogTime) * 20}px,
        ${Math.cos(fogTime * 0.7) * 10}px
    )
    `;

},16);

</script>

</body>
</html>
